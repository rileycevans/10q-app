<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; }
  .banner {
    position:relative; width:1024px; height:500px; overflow:hidden;
    background: linear-gradient(180deg, #413DE1 0%, #8164ED 100%);
    display:flex; align-items:center; justify-content:center; gap:52px;
  }
  /* Sunburst rays — same recipe as .bg-arcade::after in globals.css */
  .rays {
    position:absolute; inset:-40%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,255,255,0.14) 0deg 8deg,
      rgba(255,255,255,0) 8deg 16deg);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 62%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 62%);
    opacity:0.5;
  }
  /* Dot texture, as on the app background */
  .dots {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.18) 1.2px, transparent 1.2px);
    background-size: 10px 10px;
    opacity:0.5; mix-blend-mode: soft-light;
  }
  .inner {
    position:relative; display:flex; align-items:center; gap:48px;
    /* Google crops this asset on some surfaces; keep everything well inside */
    padding: 0 64px;
  }
  .logo { width:300px; height:auto; display:block;
    filter: drop-shadow(0 10px 0 rgba(26,26,33,0.28)); }
  .copy { display:flex; flex-direction:column; gap:18px; }
  .tag {
    font-family:'Bungee', system-ui, sans-serif;
    font-size:46px; line-height:1.08; white-space:nowrap; color:#F5F7F7;
    text-transform:uppercase; letter-spacing:0.01em;
    text-shadow: 5px 5px 0 #1A1A21;
  }
  .tag .accent { color:#DEFD4E; }
  .sub {
    font-family:'Rubik', system-ui, sans-serif; font-weight:700;
    font-size:21px; white-space:nowrap; color:#F5F7F7; opacity:0.95;
    text-shadow: 2px 2px 0 rgba(26,26,33,0.55);
  }
  .pill {
    align-self:flex-start; margin-top:4px;
    background:#4CEAFD; border:4px solid #1A1A21; border-radius:999px;
    padding:9px 22px; box-shadow:5px 5px 0 #1A1A21;
    font-family:'Rubik', system-ui, sans-serif; font-weight:700;
    font-size:19px; color:#1A1A21;
  }
</style></head>
