name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      # Fails if a generated native version file, or a release tag visible from
      # HEAD, disagrees with version.json. Cheap, and it catches the class of
      # drift that only shows up at submission time.
      - name: Version check
        run: node scripts/release/version.mjs check

      # NOTE: this env block must stay in step with the deploy job's. PostHog's
      # two vars were previously supplied only to deploy, and NEXT_PUBLIC_* is
      # inlined at build time — so CI verified an artifact with analytics
      # compiled out and production shipped a different one.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: 10q-1z
          SENTRY_PROJECT: javascript-nextjs
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Only the dev-server project. The `export` project serves apps/web/out,
      # which does not exist in this job — it is built and tested in
      # native-export, where `npm run test:e2e:export` runs it against a real
      # served export. Without the filter this job starts the dev server and
      # then fails every export test with ERR_CONNECTION_REFUSED on :4173.
      - name: Playwright E2E Tests
        run: npm run test:e2e -- --project=chromium
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # The RLS suite proves the access-control invariants that the Edge Functions
  # depend on. It needs a real Postgres with the migrations applied, so it runs
  # against a local Supabase stack rather than in the main job.
  #
  # Before blocking-fix A5 this suite was invisible to CI (supabase/tests was
  # not in the root workspaces array) *and* defaulted to the production URL and
  # anon key — so the only way it ever ran was against live user data. That is
  # how A1 and A2 survived. It is now a required check.
  rls:
    name: Schema invariants + RLS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` mints per-run keys; capture them rather than
      # hardcoding, so nothing in the repo carries a usable credential.
      - name: Start local Supabase stack
        run: |
          set -euo pipefail
          supabase start
          STATUS="$(supabase status --output json)"

          # Field names differ across CLI versions — newer ones emit
          # PUBLISHABLE_KEY / SECRET_KEY alongside (or instead of) the legacy
          # ANON_KEY / SERVICE_ROLE_KEY. jq prints the literal "null" for a
          # missing field: a non-empty value that authenticates as nothing, so
          # every query returns 42501 and the suite reads as a catastrophic RLS
          # failure rather than a bad key. That is exactly how this first failed.
          pick() {
            for k in "$@"; do
              v="$(printf '%s' "$STATUS" | jq -r --arg k "$k" '.[$k] // empty')"
              [ -n "$v" ] && { printf '%s' "$v"; return 0; }
            done
            return 1
          }

          URL="$(pick API_URL)" || { echo "could not read API_URL; available keys:"; printf '%s' "$STATUS" | jq 'keys'; exit 1; }
          ANON="$(pick ANON_KEY PUBLISHABLE_KEY)" || { echo "could not read an anon/publishable key; available keys:"; printf '%s' "$STATUS" | jq 'keys'; exit 1; }
          SERVICE="$(pick SERVICE_ROLE_KEY SECRET_KEY)" || { echo "could not read a service/secret key; available keys:"; printf '%s' "$STATUS" | jq 'keys'; exit 1; }

          {
            echo "SUPABASE_URL=$URL"
            echo "SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
          } >> "$GITHUB_ENV"

      # Assert the invariants that matter, against the schema the repo just
      # produced. If a future migration silently drops one of these, this fails
      # rather than shipping. `db query --local -o csv` talks to the stack
      # `supabase start` just brought up, so this needs no container names and
      # no credentials.
      - name: Assert security invariants hold in the built schema
        run: |
          set -euo pipefail

          # Prints a single scalar from a one-row, one-column query.
          scalar() { supabase db query --local -o csv --agent=no "$1" | tail -n 1 | tr -d '\r"'; }

          fail=0
          check() { # check <description> <expected> <actual>
            if [ "$3" = "$2" ]; then
              echo "  ok    $1"
            else
              echo "  FAIL  $1 (expected '$2', got '$3')"
              fail=1
            fi
          }

          echo "Security invariants:"

          # A6 — the answer key. This migration sat unapplied in the repo for
          # five months; the whole point of this job is that it cannot recur.
          check "is_correct not SELECTable by anon/authenticated" "0" "$(scalar "
            SELECT count(*) FROM information_schema.column_privileges
            WHERE table_schema = 'public' AND table_name = 'question_answers'
              AND column_name = 'is_correct' AND privilege_type = 'SELECT'
              AND grantee IN ('anon', 'authenticated')")"

          # A4 — the auth linkage that de-anonymises players.
          check "linked_auth_user_id not SELECTable by anon/authenticated" "0" "$(scalar "
            SELECT count(*) FROM information_schema.column_privileges
            WHERE table_schema = 'public' AND table_name = 'players'
              AND column_name = 'linked_auth_user_id' AND privilege_type = 'SELECT'
              AND grantee IN ('anon', 'authenticated')")"

          # RLS on at all, for every table holding player data. A table added
          # later without RLS is the classic way this goes wrong.
          check "no public table has RLS disabled" "0" "$(scalar "
            SELECT count(*) FROM pg_tables
            WHERE schemaname = 'public' AND NOT rowsecurity")"

          # C1 — the trigger enforced 16s while the code used 12s, so every
          # attempt was scored against a limit the client never showed.
          check "enforce_question_timing uses 12 seconds" "1" "$(scalar "
            SELECT count(*) FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'enforce_question_timing'
              AND p.prosrc LIKE '%12 seconds%'")"

          [ "$fail" = "0" ] || { echo; echo "Security invariants FAILED."; exit 1; }
          echo
          echo "All invariants hold."

      - name: Run RLS smoke tests
        # Local stack only. The suite refuses any non-local URL unless
        # ALLOW_NON_LOCAL_RLS_TESTS is set deliberately.
        run: npm run test --workspace=supabase/tests

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  native-export:
    name: Static export builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The export is what gets packaged into the iOS and Android bundles, so
      # it has to build on every commit — not only when someone remembers to
      # run it before a release. `output: 'export'` fails on things the web
      # target tolerates (route handlers, middleware, dynamic segments without
      # generateStaticParams), and those failures otherwise surface weeks later
      # at packaging time.
      - name: Build static export
        run: npm run build:native --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

      # Catches what a successful build does not: optimizer URLs that 404
      # inside the bundle, routes that exported without an index.html, missing
      # question pages. All silent at runtime.
      - name: Validate the export
        run: ./scripts/check-export.sh apps/web/out

      # Playwright against the served export — the one place a
      # server-dependency shows up as a failure rather than a silent 404 in a
      # shipped app.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Test the served export
        run: npm run test:e2e:export --workspace=apps/web

      # The build script hides middleware.ts and the Sentry server configs and
      # restores them from an EXIT trap. If a bug ever defeated that trap, the
      # next web deploy would silently ship without middleware — so assert the
      # tree is clean rather than trusting it.
      - name: Assert the source tree was restored
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "native build left the tree dirty:"
            git status --porcelain
            exit 1
          fi
          if find apps/web -name '*.native-hidden' | grep -q .; then
            echo "hidden files left behind:"
            find apps/web -name '*.native-hidden'
            exit 1
          fi
          echo "tree clean"

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Backend before clients, always. A client that ships before the schema
      # it depends on is broken for every user; a schema that ships before its
      # client is merely inert. supabase.yml lives in a separate workflow so
      # `needs:` cannot reach it — wait on its check instead.
      #
      # Only waits when this commit actually touched supabase/**, because
      # supabase.yml is path-filtered and would otherwise never report a check
      # for this ref, hanging the deploy until timeout.
      - name: Check whether this commit touches Supabase
        id: touched
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${context.payload.before}...${context.sha}`,
            });
            const hit = (data.files || []).some(f =>
              f.filename.startsWith('supabase/migrations/') ||
              f.filename.startsWith('supabase/functions/'));
            core.setOutput('supabase', hit ? 'yes' : 'no');
            core.info(hit ? 'Supabase touched — will wait for its deploy'
                          : 'No Supabase changes — deploying directly');

      # `allowed-conclusions` and the poll loop matter here: "Deploy to
      # production" is queued behind "Deploy to staging" and does not exist as
      # a check yet when this step starts. Without waiting for it to appear the
      # action reports "the requested check was never run against this ref" and
      # exits 1 — the gate racing the job it is supposed to wait for.
      - name: Wait for the Supabase deploy
        if: steps.touched.outputs.supabase == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const target = 'Deploy to production';
            const deadline = Date.now() + 25 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });

              const run = data.check_runs.find(c => c.name === target);

              if (!run) {
                core.info(`${target} has not started yet — waiting`);
              } else if (run.status !== 'completed') {
                core.info(`${target} is ${run.status} — waiting`);
              } else if (run.conclusion === 'success' || run.conclusion === 'skipped') {
                core.info(`${target} finished: ${run.conclusion}`);
                return;
              } else {
                core.setFailed(`${target} finished: ${run.conclusion} — not deploying the client ahead of the backend`);
                return;
              }

              await new Promise(r => setTimeout(r, 15000));
            }

            core.setFailed(`Timed out waiting for ${target}`);

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy
        run: npm run deploy
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: 10q-1z
          SENTRY_PROJECT: javascript-nextjs
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
